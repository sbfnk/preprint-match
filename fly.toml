app = 'preprint-match'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/"

[mounts]
  source = "analytics_data"
  destination = "/data"

[env]
  ANALYTICS_DB = "/data/analytics.db"

[[vm]]
  # Measured heap is ~1.47GB (2026-09-01), leaving ~480MB headroom.
  # 3GB was needed while the app sorted the probability matrix at boot,
  # which peaked ~600MB above steady state; percentile ranking now reads
  # precomputed quantile thresholds, so boot peak tracks steady state.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
